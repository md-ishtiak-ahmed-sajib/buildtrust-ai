[project]
name = "buildtrust-ai"
version = "0.2.0"
description = "Sandbox construction finance copilot"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.18,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.9,<3",
  "pymupdf>=1.25,<2",
  "httpx>=0.28,<1",
  "tzdata>=2026.5",
  "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "reportlab>=5.0.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
