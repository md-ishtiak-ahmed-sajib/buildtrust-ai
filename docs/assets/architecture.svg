<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 513" role="img" aria-labelledby="title desc">
<title id="title">How the application works</title><desc id="desc">React calls FastAPI, which checks project permissions and uses SQLite and private source storage.</desc>
<rect width="1000" height="513" fill="#f7f9f7"/>
<g font-family="Arial, sans-serif" fill="#19343f"><text x="40" y="48" font-size="28" font-weight="bold">How the application works</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286e62"/></marker></defs><rect x="40" y="94" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="121" font-size="22" font-weight="bold">Browser: React workspace</text><text x="62" y="145" font-size="17">14 application areas share login, project access and clear review steps.</text><path d="M 500 160 V 183" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="186" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="213" font-size="22" font-weight="bold">Server: FastAPI and deterministic services</text><text x="62" y="237" font-size="17">Document, price, measurement, accounting and payment services check every write.</text><path d="M 500 252 V 275" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="278" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="305" font-size="22" font-weight="bold">Human approval gate</text><text x="62" y="329" font-size="17">An uploaded document, forecast or language model cannot grant financial authority.</text><path d="M 500 344 V 367" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="370" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="397" font-size="22" font-weight="bold">Storage: SQLite and private files</text><text x="62" y="421" font-size="17">Exact financial records, source versions, reservations, receipts and a local audit chain.</text>
<text x="40" y="489" font-size="16" fill="#526971">Fictional local demo. BDT = Bangladeshi taka. See the text table for exact values.</text></g></svg>