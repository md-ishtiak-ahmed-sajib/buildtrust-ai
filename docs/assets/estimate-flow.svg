<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 513" role="img" aria-labelledby="title desc">
<title id="title">How an estimate becomes an approved budget</title><desc id="desc">Measurement and rate evidence lead to a locked estimate and independent budget approval.</desc>
<rect width="1000" height="513" fill="#f7f9f7"/>
<g font-family="Arial, sans-serif" fill="#19343f"><text x="40" y="48" font-size="28" font-weight="bold">How an estimate becomes an approved budget</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286e62"/></marker></defs><rect x="40" y="94" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="121" font-size="22" font-weight="bold">1. Measure and prepare</text><text x="62" y="145" font-size="17">Record dimensions, drawing references, quantities, rate components and assumptions.</text><path d="M 500 160 V 183" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="186" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="213" font-size="22" font-weight="bold">2. Compare suitable prices</text><text x="62" y="237" font-size="17">Check grade, unit, full known costs, dates and source evidence before choosing a rate.</text><path d="M 500 252 V 275" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="278" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="305" font-size="22" font-weight="bold">3. Review totals and forecast</text><text x="62" y="329" font-size="17">Show cost and tender totals separately. No real cash changes during the preview.</text><path d="M 500 344 V 367" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="370" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="397" font-size="22" font-weight="bold">4. Submit, check and approve</text><text x="62" y="421" font-size="17">Lock the version. A separate Finance Manager checks and an independent Admin approves.</text>
<text x="40" y="489" font-size="16" fill="#526971">Fictional local demo. BDT = Bangladeshi taka. See the text table for exact values.</text></g></svg>