<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">A new material rate changes the estimate</title><desc id="desc">20 tonnes: BDT 70,000 to 74,000 per tonne. Recorded cash stays at BDT 2,000,000.. Original estimate: 1,400,000; Updated estimate: 1,480,000; Earlier forecast cash: 600,000; Updated forecast cash: 520,000</desc>
<rect width="1000" height="505" fill="#f7f9f7"/>
<g font-family="Arial, sans-serif" fill="#19343f"><text x="40" y="48" font-size="28" font-weight="bold">A new material rate changes the estimate</text>
<text x="40" y="82" font-size="18">20 tonnes: BDT 70,000 to 74,000 per tonne. Recorded cash stays at BDT 2,000,000.</text><text x="40" y="153" font-size="20">Original estimate</text><rect x="310" y="128" width="444.59" height="38" fill="#60777d"/><text x="770.59" y="154" font-size="20" font-weight="bold">1,400,000</text><text x="40" y="238" font-size="20">Updated estimate</text><rect x="310" y="213" width="470.00" height="38" fill="#286e62"/><text x="796.00" y="239" font-size="20" font-weight="bold">1,480,000</text><text x="40" y="323" font-size="20">Earlier forecast cash</text><rect x="310" y="298" width="190.54" height="38" fill="#60777d"/><text x="516.54" y="324" font-size="20" font-weight="bold">600,000</text><text x="40" y="408" font-size="20">Updated forecast cash</text><rect x="310" y="383" width="165.14" height="38" fill="#286e62"/><text x="491.14" y="409" font-size="20" font-weight="bold">520,000</text>
<text x="40" y="481" font-size="16" fill="#526971">Fictional local demo. BDT = Bangladeshi taka. See the text table for exact values.</text></g></svg>