<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Cash before and after one approved payment</title><desc id="desc">A BDT 70,000 sandbox payment reduces recorded cash once.. Cash before payment: 1,000,000; Cash after payment: 930,000; Required reserve: 100,000</desc>
<rect width="1000" height="420" fill="#f7f9f7"/>
<g font-family="Arial, sans-serif" fill="#19343f"><text x="40" y="48" font-size="28" font-weight="bold">Cash before and after one approved payment</text>
<text x="40" y="82" font-size="18">A BDT 70,000 sandbox payment reduces recorded cash once.</text><text x="40" y="153" font-size="20">Cash before payment</text><rect x="310" y="128" width="470.00" height="38" fill="#60777d"/><text x="796.00" y="154" font-size="20" font-weight="bold">1,000,000</text><text x="40" y="238" font-size="20">Cash after payment</text><rect x="310" y="213" width="437.10" height="38" fill="#286e62"/><text x="763.10" y="239" font-size="20" font-weight="bold">930,000</text><text x="40" y="323" font-size="20">Required reserve</text><rect x="310" y="298" width="47.00" height="38" fill="#a65c2d"/><text x="373.00" y="324" font-size="20" font-weight="bold">100,000</text>
<text x="40" y="396" font-size="16" fill="#526971">Fictional local demo. BDT = Bangladeshi taka. See the text table for exact values.</text></g></svg>