<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 605" role="img" aria-labelledby="title desc">
<title id="title">How a payment reaches sandbox settlement</title><desc id="desc">Document review, deterministic checks, preparation, independent approval and atomic sandbox settlement.</desc>
<rect width="1000" height="605" fill="#f7f9f7"/>
<g font-family="Arial, sans-serif" fill="#19343f"><text x="40" y="48" font-size="28" font-weight="bold">How a payment reaches sandbox settlement</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286e62"/></marker></defs><rect x="40" y="94" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="121" font-size="22" font-weight="bold">1. Read and confirm documents</text><text x="62" y="145" font-size="17">Review the bill of quantities, purchase order, delivery receipt and invoice.</text><path d="M 500 160 V 183" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="186" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="213" font-size="22" font-weight="bold">2. Check the claim and cash</text><text x="62" y="237" font-size="17">Compare supported quantities and prices. Keep the cash reserve in both required scenarios.</text><path d="M 500 252 V 275" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="278" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="305" font-size="22" font-weight="bold">3. Prepare an exact proposal</text><text x="62" y="329" font-size="17">Reserve its cash and supported delivery quantities. The Operator cannot approve it.</text><path d="M 500 344 V 367" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="370" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="397" font-size="22" font-weight="bold">4. Obtain independent human approval</text><text x="62" y="421" font-size="17">A different authorized person reviews the exact amount, supplier and evidence.</text><path d="M 500 436 V 459" stroke="#286e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="462" width="920" height="65" rx="6" fill="#e6efea" stroke="#85a89c"/><text x="62" y="489" font-size="22" font-weight="bold">5. Recheck, settle and keep evidence</text><text x="62" y="513" font-size="17">Update cash, payment, ledger and audit together. A retry cannot pay twice.</text>
<text x="40" y="581" font-size="16" fill="#526971">Fictional local demo. BDT = Bangladeshi taka. See the text table for exact values.</text></g></svg>